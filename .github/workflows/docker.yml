name: docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare embed secrets
        run: |
          mkdir -p "${{ runner.temp }}/embed"
          printf '%s\n' "${{ secrets.MIAOSPEED_CRT }}" > "${{ runner.temp }}/embed/miaoko.crt"
          printf '%s\n' "${{ secrets.MIAOSPEED_KEY }}" > "${{ runner.temp }}/embed/miaoko.key"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILDCOUNT=${{ github.run_number }}
            BRAND=${{ github.event.repository.name }}
          secrets: |
            buildtoken=${{ secrets.BUILDTOKEN }}
          secret-files: |
            miaospeed_crt=${{ runner.temp }}/embed/miaoko.crt
            miaospeed_key=${{ runner.temp }}/embed/miaoko.key
          cache-from: type=gha
          cache-to: type=gha,mode=max
